<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>scrolling table fixture</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 16px; }
  .table-wrap { overflow-x: auto; max-width: 100%; }
  table { border-collapse: collapse; width: 1800px; }
  td, th { border: 1px solid #ccc; padding: 4px 8px; }
</style>
</head>
<body>
  <h1>Scrolling table fixture</h1>
  <p>The table is wider than any viewport, so it scrolls inside its own box.</p>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Name</th><th>Description</th><th>Covered by</th></tr>
      </thead>
      <tbody>
        <tr><td>Alpha</td><td>first row</td><td style="width:200px"><a href="#t-1">T-1</a></td></tr>
        <tr><td>Beta</td><td>second row</td><td style="width:200px"><a href="#t-2">T-2</a></td></tr>
      </tbody>
    </table>
  </div>
</body>
</html>

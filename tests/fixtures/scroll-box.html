<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>scroll box fixture</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 16px; }
  /* The table is wider than any viewport, but its own box scrolls, so the
     link in the last column stays reachable. */
  .table-wrap { overflow-x: auto; max-width: 100%; }
  table { border-collapse: collapse; width: 1600px; }
  td, th { border: 1px solid #ccc; padding: 4px 8px; }
</style>
</head>
<body>
  <h1>Wide table in a scroll box</h1>
  <p>The reader scrolls the table sideways to reach the last column.</p>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Name</th><th>Owner</th><th>Status</th><th>Notes</th><th>Link</th></tr>
      </thead>
      <tbody>
        <tr><td>Alpha</td><td>Team A</td><td>open</td><td>first row</td>
          <td><a href="#alpha">Open Alpha</a></td></tr>
      </tbody>
    </table>
  </div>
</body>
</html>
